# Rule 7 on Linux and Windows (D15), then the D17 pins gate. Actions and toolchain per ADR 0001.
# Trigger: every branch push runs once. A PR to main shows its head branch's run (no forks: D29),
# and runs on main seed the cache that other branches restore. No Steam client, app ID, or secret.
# No dotnet job yet: client/ holds no C# project and no dotnet-sdk pin until week 1 (client/global.json).
name: ci

on:
  push:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}-
      - name: Install the rust-toolchain.toml toolchain with the runner's rustup
        run: rustup toolchain install --no-self-update && rustc --version && cargo clippy --version
      - name: cargo fmt --all --check
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: cargo fetch --locked (Cargo.lock is current)
        run: cargo fetch --locked
      - name: cargo clippy --workspace --all-targets --locked -- -D warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo test --workspace --locked
        run: cargo test --workspace --locked
      - name: tools/checks/pins.sh (D17)
        run: tools/checks/pins.sh
